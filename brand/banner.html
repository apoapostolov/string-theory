<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1600px; height: 600px; overflow: hidden; }
      body {
        background: #08090C;
        color: #EDEFF3;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(circle at 24% 34%, rgba(0,0,0,0.95), transparent 74%);
      }
      .glow {
        position: absolute;
        width: 940px; height: 640px;
        left: -200px; top: -240px;
        background: radial-gradient(circle, rgba(61,220,151,0.13), transparent 62%);
      }
      .glow2 {
        position: absolute;
        width: 820px; height: 560px;
        right: -180px; bottom: -280px;
        background: radial-gradient(circle, rgba(120,140,255,0.12), transparent 66%);
      }
      .wrap { position: absolute; left: 88px; top: 0; height: 100%; display: flex; align-items: center; gap: 48px; }
      .mark { width: 138px; height: 138px; flex: none; filter: drop-shadow(0 20px 44px rgba(0,0,0,0.6)); }
      h1 {
        font-size: 96px;
        line-height: 0.96;
        letter-spacing: -0.035em;
        font-weight: 650;
      }
      .tag {
        margin-top: 22px;
        font-size: 31px;
        line-height: 1.3;
        color: #B4BCC8;
        letter-spacing: -0.005em;
      }
      .rule {
        margin-top: 30px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 24px;
        color: #98A2AE;
      }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: #3DDC97; flex: none; box-shadow: 0 0 14px rgba(61,220,151,0.8); }
      .pill {
        position: absolute;
        right: 88px;
        bottom: 72px;
        border: 1px solid #2A303A;
        background: rgba(20,23,28,0.9);
        color: #9AA3AF;
        padding: 11px 20px;
        border-radius: 999px;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 20px;
      }
      .pill b { color: #3DDC97; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="wrap">
      <img class="mark" src="../docs/icon.svg" alt="" />
      <div>
        <h1>String Theory</h1>
        <div class="tag">Rewrite an app's UI strings against<br />the pixel budget the layout gives them.</div>
        <div class="rule">
          <span class="dot"></span>
          <span>measured wraps</span>
          <span>·</span>
          <span>line budgets</span>
          <span>·</span>
          <span>wrap law</span>
          <span>·</span>
          <span>AI assist you can refuse</span>
        </div>
      </div>
    </div>
    <div class="pill"><b>loopback only</b> · 127.0.0.1:4317</div>
  </body>
</html>
